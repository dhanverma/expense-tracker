<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense-Tracker</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&" />
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/128/11779/11779947.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">
        <div class="closeBtn">
            <button id="closeBtn">
                <span class="material-symbols-outlined">
                    close
                </span>
            </button>
        </div>
        <div class="logo">
            <img src="https://cdn-icons-png.flaticon.com/128/11779/11779947.png " height="50" alt="Logo">
            <span>Expense Tracker</span>
        </div>
        <div class="sideBtns">
            <a href="index.html" class="navigation">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Dashboard</span>
            </a>
        </div>
        <div class="sideBtns">
            <a href="transactions.html" class="navigation active">
                <span class="material-symbols-outlined">receipt_long</span>
                <span>Transaction</span>
            </a>
        </div>
        <div class="sideBtns">
            <div class="navigation">
                <span class="material-symbols-outlined">
                    finance_mode
                </span>
                <span>Statistics</span>
            </div>
        </div>
        <div class="sideBtns">
            <div class="navigation">
                <span class="material-symbols-outlined">
                    target
                </span>
                <span>Goals</span>
            </div>
        </div>
        <div class="sideBtns">
            <div class="navigation">
                <span class="material-symbols-outlined">
                    settings
                </span>
                <span>Settings</span>
            </div>
        </div>
        <div class="log">
            <div class="sideBtns">
                <div class="navigation">
                    <span class="material-symbols-outlined">
                        help
                    </span>
                    <span>Help</span>
                </div>
            </div>
            <div class="sideBtns">
                <div class="navigation">
                    <span class="material-symbols-outlined">
                        logout
                    </span>
                    <span>Log Out</span>
                </div>
            </div>
        </div>
    </div>
    <div class="overlay"></div>
    <div class="mainPage">
        <header>
            <div>
                <button class="headBtn menuBtn">
                    <span class="material-symbols-outlined">
                        menu
                    </span>
                </button>
            </div>
            <div class="cnrBtn">
                <button class="headBtn searchBtn">
                    <span class="material-symbols-outlined">
                        search
                    </span>
                </button>
                <button class="headBtn">
                    <span class="material-symbols-outlined">
                        notifications
                    </span>
                </button>
            </div>
        </header>

        <main class="transactions-page">
            <div class="title">
                <h1>Transactions</h1>
                <p>Manage all your income and expenses.</p>
            </div>

            <div class="transaction-list">
                <div class="transaction-controls">
                    <input type="search" id="search-input" placeholder="Search transactions...">

                    <select id="category-filter">
                        <option value="All Categories">All Categories</option>
                        <option value="Grocery">Grocery</option>
                        <option value="Eating Out">Eating Out</option>
                        <option value="Communication">Communication</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Clothes">Clothes</option>
                        <option value="Health">Health</option>
                        <option value="Sports">Sports</option>
                        <option value="Toiletry">Toiletry</option>
                        <option value="Bills">Bills</option>
                        <option value="Bills">Salary</option>
                        <option value="Transport">Transport</option>
                    </select>
                </div>

                <ul id="transactions"></ul>
            </div>
        </main>

    </div>
    <script src="transactions.js"></script>
</body>

</html>
