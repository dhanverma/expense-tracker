<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense-Tracker</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&" />
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/128/11779/11779947.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">
        <div class="closeBtn">
            <button id="closeBtn">
                <span class="material-symbols-outlined">
                    close
                </span>
            </button>
        </div>
        <div class="logo">
            <img src="https://cdn-icons-png.flaticon.com/128/11779/11779947.png " height="50" alt="Logo">
            <span>Expense Tracker</span>
        </div>
        <div class="sideBtns">
            <a href="index.html" class="navigation active">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Dashboard</span>
            </a>
        </div>
        <div class="sideBtns">
            <a href="transactions.html" class="navigation">
                <span class="material-symbols-outlined">receipt_long</span>
                <span>Transaction</span>
            </a>
        </div>
        <div class="sideBtns">
            <div class="navigation">
                <span class="material-symbols-outlined">
                    finance_mode
                </span>
                <span>Statistics</span>
            </div>
        </div>
        <div class="sideBtns">
            <div class="navigation">
                <span class="material-symbols-outlined">
                    target
                </span>
                <span>Goals</span>
            </div>
        </div>
        <div class="sideBtns">
            <div class="navigation">
                <span class="material-symbols-outlined">
                    settings
                </span>
                <span>Settings</span>
            </div>
        </div>
        <div class="log">
            <div class="sideBtns">
                <div class="navigation">
                    <span class="material-symbols-outlined">
                        help
                    </span>
                    <span>Help</span>
                </div>
            </div>
            <div class="sideBtns">
                <div class="navigation">
                    <span class="material-symbols-outlined">
                        logout
                    </span>
                    <span>Log Out</span>
                </div>
            </div>
        </div>
    </div>
    <div class="overlay"></div>
    <div class="mainPage">
        <header>
            <div>
                <button class="headBtn menuBtn">
                    <span class="material-symbols-outlined">
                        menu
                    </span>
                </button>
            </div>
            <div class="cnrBtn">
                <button class="headBtn searchBtn">
                    <span class="material-symbols-outlined">
                        search
                    </span>
                </button>
                <button class="headBtn">
                    <span class="material-symbols-outlined">
                        notifications
                    </span>
                </button>
            </div>
        </header>
        <nav>
            <div class="title">
                <h1>Dashboard</h1>
                <p>Your expenses here...</p>
            </div>
            <div class="cardBox">
                <div class="card">
                    <h5>Total Income</h5>
                    <p id="income-amount">$0.00</p>
                </div>
                <div class="card">
                    <h5>Total Expenses</h5>
                    <p id="expense-amount">$0.00</p>
                </div>
                <div class="card">
                    <h5>Current Balance</h5>
                    <p id="balance-amount">$0.00</p>
                </div>
            </div>
        </nav>
        <main>


            <div class="transaction-form">
                <h3>Add Income / Expense</h3>
                <form id="transaction-form">
                    <select class="inputs" id="type" name="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                    <hr>
                    <input class="inputs" type="text" id="description" name="description" placeholder="Title"
                        required />
                    <hr>
                    <input class="inputs" type="number" id="amount" placeholder="Amount" name="amount" min="0   "
                        step="1" required />
                    <hr>
                    <select class="inputs" id="category" name="category" required>
                        <option value="" disabled selected>Category</option>
                        <option value="Grocery">Grocery</option>
                        <option value="Eating Out">Eating Out</option>
                        <option value="Communication">Communication</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Clothes">Clothes</option>
                        <option value="Health">Health</option>
                        <option value="Sports">Sports</option>
                        <option value="Toiletry">Toiletry</option>
                        <option value="Bills">Bills</option>
                        <option value="Bills">Salary</option>
                        <option value="Transport">Transport</option>
                    </select>
                    <hr>
                    <input class="inputs" type="date" id="date" name="date" max="today" required />
                    <hr>
                    <div class="formBtns">
                        <button type="button" id="cancel-edit-btn">Cancel</button>
                        <button id="submit-btn" type="submit">Add Transaction</button>
                    </div>
                </form>
            </div>

            <div class="transaction-list">
                <h3>Recent Transactions</h3>
                <div class="category-filter">
                    <select id="category-filter" name="category">
                        <option value="All Categories">All Categories</option>
                        <option value="Grocery">Grocery</option>
                        <option value="Eating Out">Eating Out</option>
                        <option value="Communication">Communication</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Clothes">Clothes</option>
                        <option value="Health">Health</option>
                        <option value="Sports">Sports</option>
                        <option value="Toiletry">Toiletry</option>
                        <option value="Bills">Bills</option>
                        <option value="Bills">Salary</option>
                        <option value="Transport">Transport</option>
                    </select>
                </div>
                <ul id="transactions"></ul>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
